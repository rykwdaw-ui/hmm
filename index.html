    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideInRight {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
    }
    @keyframes ambientPulse {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
        50% { transform: scale(1.08) translate(-10px, 10px); opacity: 0.8; }
    }
    @keyframes rowHighlight {
        0% { background-color: rgba(14, 147, 231, 0.15); }
        100% { background-color: transparent; }
    }
    
    .animate-fade-up { animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-scale-in { animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-right { animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-ambient { animation: ambientPulse 12s ease-in-out infinite; }
    .new-row-anim { animation: rowHighlight 2s ease-out forwards; }
    
    .auth-card-glass {
        background: rgba(255, 255, 255, 0.96);

        border: 1px solid rgba(226, 232, 240, 0.9);

    .btn-interactive:active {

    /* Print Styles */
    @media print {
        body * { visibility: hidden !important; }
        #print-area, #print-area * { visibility: visible !important; }
        #print-area {
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
            width: 100% !important;

    // دالة تنظيف النصوص لحماية الجداول والنافذة المنبثقة من أخطاء علامات التنصيص
    function esc(value) {
        return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }
    function escAttr(value) { return esc(value).replace(/`/g, '&#96;'); }

    // مزامنة البيانات من Firebase Firestore لحظياً (Real-time Sync)
    function initFirebaseSync() {
        // مزامنة المستخدمين
        firestore.collection("users").onSnapshot((snapshot) => {
            db.users = snapshot.docs.map(doc => doc.data());
            // إضافة حساب الإدمن الافتراضي إذا كانت المجموعة فارغة
            if (db.users.length === 0) {
                const defaultAdmin = { username: "iraq_kut", fullName: "مسؤول النظام الرئيسي", passwordHash: "2030hhhh", role: "Admin" };
                firestore.collection("users").doc(defaultAdmin.username).set(defaultAdmin).catch(err => console.error(err));
            }
            if (currentTab === 'users') switchTab('users');
        }, (error) => console.warn("Users sync notice:", error));

        // مزامنة أنواع الطلبات
        firestore.collection("requestTypes").onSnapshot((snapshot) => {
            db.requestTypes = snapshot.docs.map(doc => doc.data().name).filter(Boolean);
            if (db.requestTypes.length === 0) {
                const defaultTypes = ["طلب تعيين", "طلب نقل", "طلب إجازة", "تظلم شكوى"];
                defaultTypes.forEach(t => firestore.collection("requestTypes").doc(t).set({ name: t }));
            }
            populateRequestTypeDropdowns();
            if (currentTab === 'types') switchTab('types');
        }, (error) => console.warn("Types sync notice:", error));

        // مزامنة الطلبات
        firestore.collection("requests").onSnapshot((snapshot) => {
            db.requests = snapshot.docs.map(doc => doc.data());
            // ترتيب الطلبات تنازلياً حسب تاريخ الإضافة
            db.requests.sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
            if (currentTab === 'requests') {
                updateStatsUI();
                filterRequests();
            }
        }, (error) => console.warn("Requests sync notice:", error));
    }

    function filterRequests() {
        const tbody = document.getElementById('requests-table-body');
        if (!tbody) return;

        const search = document.getElementById('search-input')?.value.toLowerCase() || '';
        const status = document.getElementById('filter-status')?.value || '';
        const type = document.getElementById('filter-type')?.value || '';

        const filtered = db.requests.filter(r => {
            const searchStr = (r.id + ' ' + r.citizen + ' ' + (r.phone || '') + ' ' + r.type + ' ' + (r.reqDate || '') + ' ' + r.date).toLowerCase();
            const matchSearch = searchStr.includes(search);
            const matchStatus = !status || r.status === status;
            const matchType = !type || r.type === type;
            return matchSearch && matchStatus && matchType;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="py-16 text-center text-slate-400 font-semibold"><i class="fa-regular fa-folder-open text-4xl mb-3 block opacity-40"></i>لا توجد طلبات مطابقة للبحث</td></tr>`;
            return;
        }

        const isAdmin = db.currentUser && db.currentUser.role === 'Admin';

        tbody.innerHTML = filtered.map(r => {
            let statusClass = "bg-slate-100 text-slate-700 border-slate-200";
            if(r.status === 'مكتمل') statusClass = "bg-emerald-50 text-emerald-800 border-emerald-200/80";
            if(r.status === 'قيد المراجعة') statusClass = "bg-amber-50 text-amber-800 border-amber-200/80";
            if(r.status === 'مرفوض') statusClass = "bg-rose-50 text-rose-800 border-rose-200/80";
            if(r.status === 'جديد') statusClass = "bg-brand-50 text-brand-800 border-brand-200/80";

            const priorityBadge = r.priority === 'فوري' 
                ? `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200"><i class="fa-solid fa-bolt text-[10px]"></i> فوري</span>`
                : `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200">عادي</span>`;

            const statusCell = isAdmin ? `
                <select onchange="updateRequestStatus('${escAttr(r.id)}', this.value)" class="px-3 py-1.5 rounded-xl text-xs font-bold border cursor-pointer focus:outline-none transition-all ${statusClass}">
                    <option value="جديد" ${r.status === 'جديد' ? 'selected' : ''}>جديد</option>
                    <option value="قيد المراجعة" ${r.status === 'قيد المراجعة' ? 'selected' : ''}>قيد المراجعة</option>
                    <option value="مكتمل" ${r.status === 'مكتمل' ? 'selected' : ''}>مكتمل</option>
                    <option value="مرفوض" ${r.status === 'مرفوض' ? 'selected' : ''}>مرفوض</option>
                </select>
            ` : `
                <span class="inline-block px-3 py-1.5 rounded-xl text-xs font-bold border ${statusClass}">${esc(r.status)}</span>
            `;

            const editBtn = isAdmin ? `<button onclick="editRequest('${escAttr(r.id)}')" class="w-8 h-8 flex items-center justify-center bg-slate-100 hover:bg-slate-200 active:scale-95 text-brand-700 rounded-lg transition-all" title="تعديل"><i class="fa-solid fa-pen text-xs"></i></button>` : '';
            const deleteBtn = isAdmin ? `<button onclick="confirmDeleteRequest('${escAttr(r.id)}')" class="w-8 h-8 flex items-center justify-center bg-rose-50 hover:bg-rose-100 active:scale-95 text-rose-600 rounded-lg transition-all" title="حذف"><i class="fa-solid fa-trash-can text-xs"></i></button>` : '';
            const isNewHighlight = r.id === newlyAddedId ? 'new-row-anim' : '';

            return `
            <tr class="hover:bg-slate-50/80 transition-colors group ${isNewHighlight}">
                <td class="px-6 py-4 font-extrabold text-brand-700 whitespace-nowrap tracking-wide">${esc(r.id)}</td>
                <td class="px-6 py-4 font-bold text-slate-900 whitespace-nowrap">${esc(r.citizen)}</td>
                <td class="px-6 py-4 font-medium text-slate-600 whitespace-nowrap text-xs">${esc(r.phone || 'غير مدخل')}</td>
                <td class="px-6 py-4 font-medium whitespace-nowrap">${esc(r.type)}</td>
                <td class="px-6 py-4 whitespace-nowrap">${priorityBadge}</td>
                <td class="px-6 py-4 whitespace-nowrap">${statusCell}</td>
                <td class="px-6 py-4 text-slate-600 font-semibold text-xs whitespace-nowrap">${esc(r.reqDate || r.date)}</td>
                <td class="px-6 py-4 text-slate-500 font-medium text-xs whitespace-nowrap">${esc(r.date)}</td>
                <td class="px-6 py-4 text-center whitespace-nowrap">
                    <div class="flex items-center justify-center gap-1.5 opacity-90 group-hover:opacity-100 transition-opacity">
                        <button onclick="viewRequest('${escAttr(r.id)}')" class="w-8 h-8 flex items-center justify-center bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 rounded-lg transition-all" title="عرض التفاصيل"><i class="fa-solid fa-eye text-xs"></i></button>
                        ${editBtn}
                        <button onclick="printRequest('${escAttr(r.id)}')" class="w-8 h-8 flex items-center justify-center bg-slate-100 hover:bg-slate-200 active:scale-95 text-indigo-700 rounded-lg transition-all" title="طباعة"><i class="fa-solid fa-print text-xs"></i></button>
                        ${deleteBtn}
                    </div>
                </td>
            </tr>
        `}).join('');

        newlyAddedId = null;
    }

    function saveRequest(e) {
        e.preventDefault();
        const saveBtnText = document.getElementById('save-req-text');
        if (saveBtnText) saveBtnText.innerText = "جاري الحفظ...";

        const id = document.getElementById('req-id').value;
        const citizen = document.getElementById('req-citizen').value.trim();
        const phone = document.getElementById('req-phone').value.trim();
        const reqDate = document.getElementById('req-date').value;
        const type = document.getElementById('req-type').value;
        const priority = document.getElementById('req-priority').value;
        const status = document.getElementById('req-status').value;
        const notes = document.getElementById('req-notes').value.trim();

        if (id) {
            // تعديل طلب موجود في Firebase
            firestore.collection("requests").doc(id).update({
                citizen,
                phone,
                reqDate,
                type,
                priority,
                status,
                notes
            }).then(() => {
                closeRequestModal();
            });
        } else {
            // إنشاء طلب جديد في Firebase
            let nextNum = 1;
            db.requests.forEach(r => {
                if (r.id && r.id.startsWith('AZ-')) {
                    const num = parseInt(r.id.replace('AZ-', ''), 10);
                    if (!isNaN(num) && num >= nextNum) {
                        nextNum = num + 1;
                    }
                }
            });
            const autoId = 'AZ-' + nextNum;
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const newReq = {
                id: autoId,
                citizen,
                phone,
                reqDate: reqDate || dateStr,
                type,
                priority,
                status,
                notes,
                date: dateStr,
                createdAt: now.toISOString()
            };

            firestore.collection("requests").doc(autoId).set(newReq).then(() => {
                newlyAddedId = autoId;
                closeRequestModal();
            });
        }
    }

        const req = db.requests.find(r => r.id === id);
        if (!req) return;

        document.getElementById('view-modal-body').innerHTML = `

    function closeViewModal() {
        document.getElementById('view-modal').classList.add('hidden');
    }

    function editRequest(id) {
        if (db.currentUser?.role !== 'Admin') return;
        const req = db.requests.find(r => r.id === id);
        if (!req) return;

        document.getElementById('request-modal-title').innerText = "تعديل الطلب";
        document.getElementById('req-id').value = req.id;
        document.getElementById('req-citizen').value = req.citizen;
        document.getElementById('req-phone').value = req.phone || '';
        document.getElementById('req-date').value = req.reqDate || req.date;
        populateRequestTypeDropdowns();
        document.getElementById('req-type').value = req.type;
        document.getElementById('req-priority').value = req.priority;
        document.getElementById('req-status').value = req.status;
        document.getElementById('req-notes').value = req.notes || '';

        document.getElementById('request-modal').classList.remove('hidden');
    }

    function updateRequestStatus(id, newStatus) {
        if (db.currentUser?.role !== 'Admin') return;
        firestore.collection("requests").doc(id).update({ status: newStatus });
    }

    function confirmDeleteRequest(id) {
        if (db.currentUser?.role !== 'Admin') return;
        deleteTargetId = id;
        document.getElementById('confirm-delete-btn').onclick = function() {
            deleteRequest(deleteTargetId);
        };
        document.getElementById('delete-modal').classList.remove('hidden');
    }

    function closeDeleteModal() {
        deleteTargetId = null;
        document.getElementById('delete-modal').classList.add('hidden');
    }

    function deleteRequest(id) {
        if (db.currentUser?.role !== 'Admin') return;
        firestore.collection("requests").doc(id).delete().then(() => {
            closeDeleteModal();
        });
    }

    function openUserModal() {
        document.getElementById('user-fullname').value = '';
        document.getElementById('user-username').value = '';
        document.getElementById('user-password').value = '';
        document.getElementById('user-role').value = 'Employee';
        document.getElementById('user-modal').classList.remove('hidden');
    }

    function closeUserModal() {
        document.getElementById('user-modal').classList.add('hidden');
    }

    function saveUser(e) {
        e.preventDefault();
        if (db.currentUser?.role !== 'Admin') return;
        const fullName = document.getElementById('user-fullname').value.trim();
        const username = document.getElementById('user-username').value.trim();
        const password = document.getElementById('user-password').value;
        const role = document.getElementById('user-role').value;

        if (db.users.some(u => u.username === username)) {
            alert('اسم المستخدم موجود بالفعل.');
            return;
        }

        firestore.collection("users").doc(username).set({
            fullName, username, passwordHash: password, role
        }).then(() => {
            closeUserModal();
        });
    }

    function deleteUser(username) {
        if (db.currentUser?.role !== 'Admin') return;
        firestore.collection("users").doc(username).delete();
    }

    function renderTypesView() {

                                <tr class="hover:bg-slate-50 transition-colors">

                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }

    function openTypeModal() {
        document.getElementById('type-name').value = '';
        document.getElementById('type-modal').classList.remove('hidden');
    }

    function closeTypeModal() {
        document.getElementById('type-modal').classList.add('hidden');
    }

    function saveType(e) {
        e.preventDefault();
        if (db.currentUser?.role !== 'Admin') return;
        const name = document.getElementById('type-name').value.trim();
        if (name) {
            firestore.collection("requestTypes").doc(name).set({ name }).then(() => {
                closeTypeModal();
            });
        }
    }

    function deleteType(typeName) {
        if (db.currentUser?.role !== 'Admin') return;
        firestore.collection("requestTypes").doc(typeName).delete();
    }
</script>
