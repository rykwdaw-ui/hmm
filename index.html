    <style>

<body class="h-full bg-slate-50 text-slate-800 flex flex-col antialiased selection:bg-brand-200 selection:text-brand-900 overflow-x-hidden">

    <div id="print-area" class="hidden"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2PJTCkIl1DehcLLK_Wpy4X-QTVG4ycH0",
            authDomain: "hmm-ecc74.firebaseapp.com",
            projectId: "hmm-ecc74",
            storageBucket: "hmm-ecc74.firebasestorage.app",
            messagingSenderId: "1092745287735",
            appId: "1:1092745287735:web:6e4dbce88f2d7117b507b2",
            measurementId: "G-8V30XE656Y"
        };

        firebase.initializeApp(firebaseConfig);
        const firestore = firebase.firestore();
        const auth = firebase.auth();
        const AUTH_DOMAIN = "@hmm.local";
        const authEmail = (username) => `${username.trim().toLowerCase()}${AUTH_DOMAIN}`;

        let db = { currentUser: null, users: [], requestTypes: [], requests: [] };
        let currentTab = 'dashboard';
        let deleteTargetId = null;
        let unsubscribeFirebaseSync = [];

        function stopFirebaseSync() {
            unsubscribeFirebaseSync.forEach(unsub => { try { unsub(); } catch (_) {} });
            unsubscribeFirebaseSync = [];
        }

        function initFirebaseSync() {
            stopFirebaseSync();
            unsubscribeFirebaseSync.push(firestore.collection("users").onSnapshot((snapshot) => {
                db.users = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
                if (currentTab === 'users') switchTab('users');
            }, (error) => console.error('users sync error:', error)));

            unsubscribeFirebaseSync.push(firestore.collection("requestTypes").onSnapshot((snapshot) => {
                db.requestTypes = snapshot.docs.map(doc => doc.data().name).filter(Boolean);
                if (db.requestTypes.length === 0 && db.currentUser?.role === 'Admin') {
                    const defaultTypes = ["طلب تعيين", "طلب نقل", "طلب إجازة", "تظلم شكوى"];
                    defaultTypes.forEach(t => firestore.collection("requestTypes").doc(t).set({ name: t }));
                }
                populateRequestTypeDropdowns();
                if (currentTab === 'types') switchTab('types');
            }, (error) => console.error('types sync error:', error)));

            unsubscribeFirebaseSync.push(firestore.collection("requests").onSnapshot((snapshot) => {
                db.requests = snapshot.docs.map(doc => doc.data());
                db.requests.sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
                if (currentTab === 'requests') { updateStatsUI(); filterRequests(); }
                if (currentTab === 'dashboard') renderDashboardStats();
            }, (error) => console.error('requests sync error:', error)));
        }

        // مراقبة الجلسة والتحقق من المستند
        auth.onAuthStateChanged(async (firebaseUser) => {
            if (!firebaseUser) {
                stopFirebaseSync();
                return;
            }
            try {
                const snap = await firestore.collection('users').doc(firebaseUser.uid).get();
                if (!snap.exists) {
                    showLoginError("المستخدم غير مسجل في قاعدة البيانات (Firestore) بالـ UID المطابق.");
                    await auth.signOut();
                    return;
                }
                if (snap.data().active === false) {
                    showLoginError("تم تعطيل هذا الحساب من قبل الإدارة.");
                    await auth.signOut();
                    return;
                }
                db.currentUser = { ...snap.data(), uid: firebaseUser.uid };
                initFirebaseSync();
                bootApp();
            } catch (error) {
                console.error('Firestore Error:', error);
                showLoginError("خطأ في قراءة بيانات الحساب (تأكد من قواعد Firestore Rules).");
                await auth.signOut();
            }
        });

        function showLoginError(msg) {
            const errEl = document.getElementById('login-error-msg');
            const errText = document.getElementById('login-error-text');
            errText.innerText = msg;
            errEl.classList.remove('hidden');
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const errEl = document.getElementById('login-error-msg');
            const submitBtn = document.getElementById('login-submit-btn');
            const btnText = document.getElementById('login-btn-text');

            if (!username || !password) return;
            submitBtn.disabled = true;
            btnText.innerText = "جاري التحقق...";
            errEl.classList.add('hidden');

            auth.signInWithEmailAndPassword(authEmail(username), password)
                .catch((error) => {
                    console.error("Auth Error:", error.code);
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                        showLoginError("اسم المستخدم أو كلمة المرور غير صحيحة.");
                    } else if (error.code === 'auth/unauthorized-domain') {
                        showLoginError("هذا الدومين غير مصرح به في Firebase Console.");
                    } else {
                        showLoginError("خطأ: " + error.message);
                    }
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    btnText.innerText = "تسجيل الدخول";
                });
        }

        function bootApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('main-app').classList.add('flex');

            const user = db.currentUser;
            document.getElementById('header-role-badge').innerText = user.role === 'Admin' ? 'مدير النظام' : 'موظف';
            document.getElementById('current-user-display').innerText = user.fullName;

            if (user.role === 'Admin') {
                document.getElementById('admin-nav-section').classList.remove('hidden');
            } else {
                document.getElementById('admin-nav-section').classList.add('hidden');
            }

            populateRequestTypeDropdowns();
            switchTab('dashboard');
        }

        async function logoutSession() {
            try { await auth.signOut(); } catch (e) { console.error(e); }
            stopFirebaseSync();
            db.currentUser = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('main-app').classList.remove('flex');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('login-password').value = '';
        }

        function switchTab(tabId) {
            if ((tabId === 'users' || tabId === 'types') && db.currentUser?.role !== 'Admin') { tabId = 'dashboard'; }
            currentTab = tabId;
            document.querySelectorAll('aside nav button').forEach(btn => {
                btn.classList.remove('bg-brand-50', 'text-brand-700', 'border-r-4', 'border-brand-600');
                btn.classList.add('text-slate-600', 'hover:bg-slate-50', 'border-transparent');
            });

            const activeBtn = document.getElementById('nav-' + tabId);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-50', 'border-transparent');
                activeBtn.classList.add('bg-brand-50', 'text-brand-700', 'border-r-4', 'border-brand-600');
            }

            const mainContent = document.getElementById('main-content-area');
            if (!mainContent) return;

            if (tabId === 'dashboard') {
                mainContent.innerHTML = renderDashboardView();
                renderDashboardStats();
            } else if (tabId === 'requests') {
                mainContent.innerHTML = renderRequestsView();
                filterRequests();
            } else if (tabId === 'users') {
                mainContent.innerHTML = renderUsersView();
            } else if (tabId === 'types') {
                mainContent.innerHTML = renderTypesView();
            }
        }

        function esc(value) {
            return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
        }
        function escAttr(value) { return esc(value).replace(/`/g, '&#96;'); }

        function renderDashboardView() {
            const user = db.currentUser || {};
            const total = db.requests.length;
            const pending = db.requests.filter(r => r.status === 'قيد المراجعة' || r.status === 'جديد').length;
            const completed = db.requests.filter(r => r.status === 'مكتمل').length;
            const urgent = db.requests.filter(r => r.priority === 'فوري').length;
            const recent = db.requests.slice(0, 5);
            return `
                <div class="space-y-6 animate-slide-right">
                    <section class="bg-gradient-to-br from-brand-950 via-brand-900 to-brand-700 rounded-[2rem] p-6 sm:p-8 text-white app-card">
                        <p class="text-xs font-bold text-brand-100 mb-2">مرحباً بعودتك</p>
                        <h2 class="text-2xl sm:text-3xl font-extrabold">${esc(user.fullName || 'مستخدم')}</h2>
                        <p class="text-sm text-brand-100/80 mt-2">نظام حركة همم الموحد</p>
                    </section>
                    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white rounded-2xl p-5 text-right border border-slate-200/80 app-card">
                            <p class="text-xs font-bold text-slate-400">إجمالي الطلبات</p><strong id="dash-total" class="block text-2xl mt-1">${total}</strong>
                        </div>
                        <div class="bg-white rounded-2xl p-5 text-right border border-slate-200/80 app-card">
                            <p class="text-xs font-bold text-slate-400">قيد المتابعة</p><strong id="dash-pending" class="block text-2xl mt-1">${pending}</strong>
                        </div>
                        <div class="bg-white rounded-2xl p-5 text-right border border-slate-200/80 app-card">
                            <p class="text-xs font-bold text-slate-400">مكتملة</p><strong id="dash-completed" class="block text-2xl mt-1">${completed}</strong>
                        </div>
                        <div class="bg-white rounded-2xl p-5 text-right border border-slate-200/80 app-card">
                            <p class="text-xs font-bold text-slate-400">طلبات فورية</p><strong id="dash-urgent" class="block text-2xl mt-1">${urgent}</strong>
                        </div>
                    </section>
                </div>`;
        }

        function renderDashboardStats() {
            const total = db.requests.length;
            const pending = db.requests.filter(r => r.status === 'قيد المراجعة' || r.status === 'جديد').length;
            const completed = db.requests.filter(r => r.status === 'مكتمل').length;
            const urgent = db.requests.filter(r => r.priority === 'فوري').length;
            [['dash-total', total], ['dash-pending', pending], ['dash-completed', completed], ['dash-urgent', urgent]].forEach(([id,v]) => { const el=document.getElementById(id); if(el) el.innerText=v; });
        }

        function renderRequestsView() {
            return `
                <div class="space-y-6 animate-slide-right">
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200/80 p-5 flex justify-between items-center">
                        <input type="text" id="search-input" oninput="filterRequests()" placeholder="ابحث باسم المواطن أو الرقم..." class="pr-4 pl-4 py-2 text-sm rounded-xl bg-slate-50 border border-slate-200 w-72">
                        <button onclick="openRequestModal()" class="px-6 py-2.5 bg-brand-900 text-white font-bold text-sm rounded-xl"><i class="fa-solid fa-plus text-xs ml-1"></i> طلب جديد</button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200/80 overflow-x-auto">
                        <table class="w-full text-right text-sm">
                            <thead class="bg-slate-50 border-b border-slate-200 text-slate-500">
                                <tr>
                                    <th class="px-6 py-4">رقم الطلب</th>
                                    <th class="px-6 py-4">اسم المواطن</th>
                                    <th class="px-6 py-4">النوع</th>
                                    <th class="px-6 py-4">الأولوية</th>
                                    <th class="px-6 py-4">الحالة</th>
                                    <th class="px-6 py-4 text-center">إجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="requests-table-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>`;
        }

        function filterRequests() {
            const tbody = document.getElementById('requests-table-body');
            if (!tbody) return;
            const search = document.getElementById('search-input')?.value.toLowerCase() || '';
            const filtered = db.requests.filter(r => (r.id + ' ' + r.citizen).toLowerCase().includes(search));

            if (!filtered.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-10 text-center text-slate-400">لا توجد طلبات مسجلة</td></tr>`;
                return;
            }
            tbody.innerHTML = filtered.map(r => `
                <tr class="hover:bg-slate-50">
                    <td class="px-6 py-4 font-bold text-brand-700">${esc(r.id)}</td>
                    <td class="px-6 py-4 font-bold">${esc(r.citizen)}</td>
                    <td class="px-6 py-4">${esc(r.type)}</td>
                    <td class="px-6 py-4">${esc(r.priority)}</td>
                    <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-100">${esc(r.status)}</span></td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="viewRequest('${esc(r.id)}')" class="p-2 text-slate-500 hover:text-brand-600"><i class="fa-solid fa-eye"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function openRequestModal() {
            document.getElementById('req-id').value = '';
            document.getElementById('req-citizen').value = '';
            document.getElementById('req-phone').value = '';
            document.getElementById('req-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('request-modal').classList.remove('hidden');
        }
        function closeRequestModal() { document.getElementById('request-modal').classList.add('hidden'); }

        function saveRequest(e) {
            e.preventDefault();
            const citizen = document.getElementById('req-citizen').value.trim();
            const phone = document.getElementById('req-phone').value.trim();
            const reqDate = document.getElementById('req-date').value;
            const type = document.getElementById('req-type').value;
            const priority = document.getElementById('req-priority').value;
            const status = document.getElementById('req-status').value;
            const notes = document.getElementById('req-notes').value.trim();

            let nextNum = db.requests.length + 1;
            const autoId = 'AZ-' + nextNum;
            const now = new Date();

            firestore.collection("requests").doc(autoId).set({
                id: autoId, citizen, phone, reqDate, type, priority, status, notes,
                date: now.toISOString().split('T')[0], createdAt: now.toISOString()
            }).then(() => closeRequestModal());
        }

        function populateRequestTypeDropdowns() {
            const select = document.getElementById('req-type');
            if (!select) return;
            select.innerHTML = db.requestTypes.map(t => `<option value="${escAttr(t)}">${esc(t)}</option>`).join('');
        }

        function renderUsersView() {
            return `
                <div class="space-y-6 animate-slide-right">
                    <div class="bg-white rounded-2xl p-6 shadow-xs border border-slate-200/80 flex justify-between items-center">
                        <h2 class="text-xl font-extrabold text-slate-900">إدارة المستخدمين</h2>
                        <button onclick="openUserModal()" class="px-5 py-2.5 bg-brand-900 text-white font-bold text-xs rounded-xl">إضافة مستخدم</button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200/80 overflow-hidden">
                        <table class="w-full text-right text-sm">
                            <thead class="bg-slate-50 text-slate-500"><tr><th class="px-6 py-4">الاسم</th><th class="px-6 py-4">اسم المستخدم</th><th class="px-6 py-4">الدور</th></tr></thead>
                            <tbody class="divide-y divide-slate-100">
                                ${db.users.map(u => `<tr><td class="px-6 py-4 font-bold">${esc(u.fullName)}</td><td class="px-6 py-4">${esc(u.username)}</td><td class="px-6 py-4">${esc(u.role)}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        function openUserModal() { document.getElementById('user-modal').classList.remove('hidden'); }
        function closeUserModal() { document.getElementById('user-modal').classList.add('hidden'); }

        async function saveUser(e) {
            e.preventDefault();
            const fullName = document.getElementById('user-fullname').value.trim();
            const username = document.getElementById('user-username').value.trim().toLowerCase();
            const password = document.getElementById('user-password').value;
            const role = document.getElementById('user-role').value;

            try {
                const appName = 'hmm-creator';
                let secApp = firebase.apps.find(a => a.name === appName) || firebase.initializeApp(firebaseConfig, appName);
                const cred = await secApp.auth().createUserWithEmailAndPassword(authEmail(username), password);
                await firestore.collection('users').doc(cred.user.uid).set({
                    uid: cred.user.uid, fullName, username, role, active: true
                });
                await secApp.auth().signOut();
                closeUserModal();
            } catch (err) {
                alert("خطأ أثناء إنشاء المستخدم: " + err.message);
            }
        }

        function renderTypesView() {
            return `
                <div class="space-y-6 animate-slide-right">
                    <div class="bg-white rounded-2xl p-6 border border-slate-200/80 flex justify-between items-center">
                        <h2 class="text-xl font-extrabold text-slate-900">أنواع الطلبات</h2>
                        <button onclick="openTypeModal()" class="px-5 py-2.5 bg-brand-900 text-white font-bold text-xs rounded-xl">نوع جديد</button>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200/80 p-4">
                        ${db.requestTypes.map(t => `<div class="p-3 border-b border-slate-100 font-bold">${esc(t)}</div>`).join('')}
                    </div>
                </div>`;
        }

        function openTypeModal() { document.getElementById('type-modal').classList.remove('hidden'); }
        function closeTypeModal() { document.getElementById('type-modal').classList.add('hidden'); }
        function saveType(e) {
            e.preventDefault();
            const name = document.getElementById('type-name').value.trim();
            if (name) firestore.collection("requestTypes").doc(name).set({ name }).then(() => closeTypeModal());
        }
    </script>
</body>
</html>
